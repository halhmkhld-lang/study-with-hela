<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🎮 لعبة المعدل 100 PRO</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:linear-gradient(135deg,#0f172a,#4f46e5,#9333ea);color:#fff}
.app{max-width:900px;margin:auto;padding:20px}
.header{text-align:center;padding:20px}
.icon{width:90px;height:90px;border-radius:22px;background:#fff;color:#4f46e5;display:flex;align-items:center;justify-content:center;font-size:44px;margin:auto}
.card{background:#ffffff15;backdrop-filter:blur(10px);padding:14px;border-radius:16px;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
button{padding:10px 12px;border:none;border-radius:12px;cursor:pointer;font-weight:bold}
.add{background:#22c55e;color:#fff}
.reset{background:#ef4444;color:#fff;width:100%;margin-top:10px}
.barbg{height:18px;background:#ffffff30;border-radius:999px;overflow:hidden}
.bar{height:100%;width:0%;background:#22c55e}
.big{font-size:22px;font-weight:bold;margin:6px 0}
.small{font-size:13px;opacity:.85}
.badge{display:inline-block;background:#f59e0b;color:#000;padding:4px 10px;border-radius:999px;font-size:12px;margin:4px}
input{padding:8px;border-radius:10px;border:none;width:120px}
.msg{font-size:14px;margin-top:6px;opacity:.9}
</style>
</head>
<body>
<div class="app"><div class="header">
<div class="icon">🎮</div>
<h1>لعبة المعدل 100 PRO</h1>
<p>هيلايتي 😏 نظام ثابت وما ينكسر</p>
</div><div class="card">
<div class="big">🎯 الهدف</div>
<input id="target" type="number" value="100" onchange="saveTarget();calc()">
</div><div class="card">
<div class="big" id="days">⏳ الأيام المتبقية: 48</div>
<div class="msg" id="msg">ابدئي… إنتِ تتحكمين 😌</div>
</div><div class="card">
<div class="barbg"><div class="bar" id="bar"></div></div>
<div class="big" id="pct">0%</div>
<div class="big" id="grade">المعدل: 0</div>
</div><div class="card">
<div class="big">👤 XP</div>
<div id="xp">0</div>
<div id="ach"></div>
</div><div class="grid" id="subjects"></div><button class="reset" onclick="resetAll()">🔄 إعادة</button>

</div><script>
const data=[
{name:"التربية الإسلامية",total:4},
{name:"اللغة العربية",total:9},
{name:"الإنكليزي",total:6},
{name:"الأحياء",total:4},
{name:"الرياضيات",total:5},
{name:"الكيمياء",total:7},
{name:"الفيزياء",total:9}
];

let state=JSON.parse(localStorage.getItem('state')||'{}');
let enabled=JSON.parse(localStorage.getItem('enabled')||'{}');
let xp=parseInt(localStorage.getItem('xp')||0);
let ach=JSON.parse(localStorage.getItem('ach')||'[]');
let target=parseInt(localStorage.getItem('target')||100);

// 🔊 صوت عند الضغط
function playSound(){
const ctx=new (window.AudioContext||window.webkitAudioContext)();
const o=ctx.createOscillator();
const g=ctx.createGain();
o.connect(g);g.connect(ctx.destination);
o.type='sine';
o.frequency.value=880;
g.gain.value=0.08;
o.start();
setTimeout(()=>{o.stop();ctx.close();},120);
}

function saveAll(){
localStorage.setItem('state',JSON.stringify(state));
localStorage.setItem('enabled',JSON.stringify(enabled));
localStorage.setItem('xp',xp);
localStorage.setItem('ach',JSON.stringify(ach));
localStorage.setItem('target',target);
}

function saveTarget(){
target=parseInt(document.getElementById('target').value||100);
saveAll();}

function addXP(v){
xp+=v;
playSound(); // 🔥 الصوت هنا
if(xp>=10 && !ach.includes('🏅 بداية قوية')) ach.push('🏅 بداية قوية');
if(xp>=20 && !ach.includes('🎖 مجتهدة')) ach.push('🎖 مجتهدة');
if(xp>=40 && !ach.includes('🏆 قوية')) ach.push('🏆 قوية');
if(xp>=60 && !ach.includes('👑 أسطورة')) ach.push('👑 أسطورة');
saveAll();
}

function init(){
document.getElementById('target').value=target;
let html='';
data.forEach((s,i)=>{
if(state[i]==null) state[i]=0;
if(enabled[i]==null) enabled[i]=true;
html+=`<div class='card'>
<div class='big'>${s.name}</div>
<div>${state[i]}/${s.total}</div>
<button class='add' onclick='add(${i})'>+ XP</button>
<label><input type='checkbox' onchange='toggle(${i})' ${enabled[i]?'checked':''}> مفعلة</label>
</div>`;
});
document.getElementById('subjects').innerHTML=html;
calc();}

function add(i){
if(!enabled[i]) return;
if(state[i]<data[i].total){state[i]++;addXP(1);saveAll();init();}
}

function toggle(i){enabled[i]=!enabled[i];saveAll();init();}

function calc(){
let done=0,total=0;
data.forEach((s,i)=>{if(enabled[i]){done+=state[i];total+=s.total;}});
let pct=total?(done/total)*100:0;
let grade=(pct/100)*target;
document.getElementById('xp').innerText=xp;
document.getElementById('ach').innerHTML=ach.map(a=>`<span class='badge'>${a}</span>`).join('');
document.getElementById('pct').innerText=pct.toFixed(1)+'%';
document.getElementById('grade').innerText='المعدل: '+grade.toFixed(1);
document.getElementById('bar').style.width=pct+'%';
}

function resetAll(){localStorage.clear();location.reload();}

init();
</script></body>
</html>
