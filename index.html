<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🎮 لعبة المعدل 100</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:linear-gradient(135deg,#111827,#4f46e5,#9333ea);color:#fff}
.app{max-width:900px;margin:auto;padding:20px}
.header{text-align:center;padding:20px}
.icon{width:90px;height:90px;border-radius:22px;background:#fff;color:#4f46e5;display:flex;align-items:center;justify-content:center;font-size:44px;margin:auto}
.card{background:#ffffff15;backdrop-filter:blur(10px);padding:14px;border-radius:16px;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
button{padding:10px 12px;border:none;border-radius:12px;cursor:pointer;font-weight:bold}
.add{background:#22c55e;color:#fff}
.reset{background:#ef4444;color:#fff;width:100%;margin-top:10px}
.barbg{height:18px;background:#ffffff30;border-radius:999px;overflow:hidden}
.bar{height:100%;width:0%;background:#22c55e}
.big{font-size:22px;font-weight:bold;margin:6px 0}
.small{font-size:13px;opacity:.85}
.badge{display:inline-block;background:#f59e0b;color:#000;padding:4px 10px;border-radius:999px;font-size:12px;margin:4px 4px 0 0}
input{padding:8px;border-radius:10px;border:none;width:120px}
.msg{font-size:14px;margin-top:6px;opacity:.9}
</style>
</head>
<body>
<div class="app"><div class="header">
<div class="icon">🎮</div>
<h1>لعبة المعدل 100</h1>
<p>هيلايتي 😏 إنتِ مو طالبة… إنتِ لاعبة مستوى صعب</p>
<div class="card">
<div class="big">👤 ملف المستخدم</div>
<div id="xp">XP: 0</div>
<div id="ach">🏆 الجوائز: لا يوجد</div>
</div>
<div class="badge" id="level">المستوى: 1</div>
</div><div class="card">
<div class="big">🎯 اختاري الهدف</div>
<input id="target" type="number" min="0" max="100" value="100" onchange="saveTarget();calc()">
</div><div class="card">
<div class="big" id="days">⏳ الأيام المتبقية: 48</div>
<div class="msg" id="msg">ابدئي اللعب… النجاح ينتظرج 😌</div>
</div><div class="card">
<div class="barbg"><div class="bar" id="bar"></div></div>
<div class="big" id="pct">0%</div>
<div class="big" id="grade">المعدل: 0</div>
</div><div class="grid" id="subjects"></div><button class="reset" onclick="resetAll()">🔄 إعادة اللعبة</button>

</div><script>
const data=[
{name:"التربية الإسلامية",total:4,enabled:true},
{name:"اللغة العربية",total:9,enabled:true},
{name:"الإنكليزي",total:6,enabled:true},
{name:"الأحياء",total:4,enabled:true},
{name:"الرياضيات",total:5,enabled:true},
{name:"الكيمياء",total:7,enabled:true},
{name:"الفيزياء",total:9,enabled:true}
];

const messages=[
"🔥 لا توقفين هسه",
"😏 المعدل ينتظرج",
"📚 كل XP يقربج",
"💪 إنتِ قوية",
"🎮 لعبه حقيقية"
];

let state=JSON.parse(localStorage.getItem('state')||'{}');
let enabled=JSON.parse(localStorage.getItem('enabled')||'{}');
let achievements=JSON.parse(localStorage.getItem('ach')||'[]');
let startDate=localStorage.getItem('startDate');
let target=parseInt(localStorage.getItem('target')||"100");

if(!startDate){startDate=Date.now();localStorage.setItem('startDate',startDate);}

function saveTarget(){
localStorage.setItem('target',document.getElementById('target').value);
}

function calcDays(){
let total=48;
let passed=Math.floor((Date.now()-startDate)/(1000*60*60*24));
let left=Math.max(total-passed,0);
document.getElementById('days').innerText='⏳ الأيام المتبقية: '+left;
}

function randomMsg(){
document.getElementById('msg').innerText=messages[Math.floor(Math.random()*messages.length)];
}

function getXP(){
let xp=0;
Object.values(state).forEach(v=>xp+=v);
return xp;
}

function checkAchievements(xp){
let rewards=["🏅 مبتدئة مجتهدة","🎖 نصف الطريق","🏆 مقاتلة سادس","👑 أسطورة دراسة"];

rewards.forEach((r,i)=>{
if(xp>= (i+1)*10 && !achievements.includes(r)){
achievements.push(r);
}
});

localStorage.setItem('ach',JSON.stringify(achievements));
}

function updateProfile(xp){
document.getElementById('xp').innerText='XP: '+xp;

document.getElementById('ach').innerHTML=
achievements.length?achievements.map(a=>`<span class='badge'>${a}</span>`).join(''):'لا يوجد';
}

function calcLevel(pct){
if(pct<20) return "1";
if(pct<40) return "2";
if(pct<60) return "3";
if(pct<80) return "4";
if(pct<95) return "5";
return "6 🔥";
}

function init(){
document.getElementById('target').value=target;
let html='';
data.forEach((s,i)=>{
if(enabled[i]===undefined) enabled[i]=true;
if(!state[i]) state[i]=0;
html+=`<div class='card'>
<div class='big'>${s.name}</div>
<div>📊 ${state[i]}/${s.total}</div>
<button class='add' onclick='add(${i})'>+ XP</button>
<div><label><input type='checkbox' onchange='toggle(${i})' ${enabled[i]?'checked':''}> مفعّلة</label></div>
</div>`;
});
document.getElementById('subjects').innerHTML=html;
calc();calcDays();randomMsg();
}

function add(i){
if(!enabled[i]) return;
if(state[i]<data[i].total){state[i]++;save();calc();init();}
}

function toggle(i){enabled[i]=!enabled[i];save();calc();init();}

function calc(){
let done=0,total=0;
data.forEach((s,i)=>{if(enabled[i]){done+=state[i];total+=s.total;}});

let pct=total? (done/total)*100:0;
let target=parseInt(document.getElementById('target').value)||100;
let grade=(pct/100)*target;

let xp=getXP();
checkAchievements(xp);
updateProfile(xp);

let lvl=calcLevel(pct);
document.getElementById('level').innerText='المستوى: '+lvl;

document.getElementById('pct').innerText=pct.toFixed(1)+'%';
document.getElementById('grade').innerText='المعدل: '+grade.toFixed(1)+' / '+target;
document.getElementById('bar').style.width=pct+'%';
}

function save(){
localStorage.setItem('state',JSON.stringify(state));
localStorage.setItem('enabled',JSON.stringify(enabled));
}

function resetAll(){localStorage.clear();location.reload();}

setInterval(()=>{randomMsg();calcDays();},8000);
init();
</script></body>
</html>
